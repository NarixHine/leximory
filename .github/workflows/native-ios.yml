name: Native iOS
on:
  pull_request:
    paths: ['apps/leximory-ios/**', 'apps/leximory/server/mobile/**', 'apps/leximory/app/api/mobile/**', 'apps/leximory/tests/mobile-*.ts', 'packages/api/**', 'packages/schema/src/mobile/**', 'packages/service/src/access.ts', 'pnpm-lock.yaml', '.github/workflows/native-ios.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --dir apps/leximory run test:mobile
      - run: pnpm --dir packages/api run generate
      - run: git diff --exit-code -- apps/leximory-ios/Core/Sources/LeximoryCore/openapi.json apps/leximory-ios/Core/Tests/LeximoryCoreTests/Fixtures/definition-stream.ndjson
      - run: pnpm --dir apps/leximory run check-types
  simulator:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path apps/leximory-ios/Core --disable-automatic-resolution
      - run: apps/leximory-ios/scripts/generate-project.sh
      - name: Test iPhone and iPad
        shell: bash
        run: |
          set -euo pipefail
          for family in iPhone iPad; do
            destination=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; family=sys.argv[1]; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for runtime,rows in devices.items() if "iOS-26" in runtime for d in rows if d["name"].startswith(family)))' "$family")
            xcodebuild test -project apps/leximory-ios/Leximory.xcodeproj -scheme Leximory -destination "platform=iOS Simulator,id=$destination" -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO -resultBundlePath "results-$family.xcresult"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-results
          path: results-*.xcresult
